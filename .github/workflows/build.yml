name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download AI model
        run: |
          mkdir -p app/src/main/assets /tmp/model
          curl -L --fail -o /tmp/model/model.zip https://qaihub-public-assets.s3.us-west-2.amazonaws.com/qai-hub-models/models/real_esrgan_x4plus/releases/v0.67.0/real_esrgan_x4plus-tflite-float.zip
          unzip -o /tmp/model/model.zip -d /tmp/model/extracted
          find /tmp/model/extracted -name '*.tflite'
          cp "$(find /tmp/model/extracted -name '*.tflite' | head -n 1)" app/src/main/assets/esrgan.tflite
          ls -l app/src/main/assets
          test "$(stat -c%s app/src/main/assets/esrgan.tflite)" -gt 1000000
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
